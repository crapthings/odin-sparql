name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: crapthings/odin-rdf
          ref: 20f339d1977f14a99ed7962f547db27ba22ae512 # v0.31.0
          path: _deps/odin-rdf
      - uses: laytan/setup-odin@8536d8fa450ec6f1bd9ddc84bbaaf16296c0051d # v2.12.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: odin check sparql -no-entry-point -collection:odin-rdf=_deps/odin-rdf
      - run: odin test sparql -collection:odin-rdf=_deps/odin-rdf
      - run: odin test sparql/internal/lexer -collection:odin-rdf=_deps/odin-rdf
      - run: odin test sparql/results -collection:odin-rdf=_deps/odin-rdf
      - run: odin test tests/public_parser -collection:odin-rdf=_deps/odin-rdf
      - run: odin test tests/public_engine -collection:odin-rdf=_deps/odin-rdf
      - run: odin test tests/dataset -collection:odin-rdf=_deps/odin-rdf
      - run: odin test tests/property -collection:odin-rdf=_deps/odin-rdf
      - run: odin run examples/minimal -collection:odin-rdf=_deps/odin-rdf
      - run: odin run examples/custom_view -collection:odin-rdf=_deps/odin-rdf
      - run: odin run tests/fuzz -define:FUZZ_CASES=1000 -define:FUZZ_MAX_BYTES=256 -collection:odin-rdf=_deps/odin-rdf
      - run: odin test sparql/algebra -collection:odin-rdf=_deps/odin-rdf
      - run: odin test sparql/eval -collection:odin-rdf=_deps/odin-rdf
      - run: odin test sparql/engine -collection:odin-rdf=_deps/odin-rdf

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: crapthings/odin-rdf
          ref: 20f339d1977f14a99ed7962f547db27ba22ae512 # v0.31.0
          path: _deps/odin-rdf
      - uses: laytan/setup-odin@8536d8fa450ec6f1bd9ddc84bbaaf16296c0051d # v2.12.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: sh scripts/check-release-facts.sh
      - run: odin check sparql -no-entry-point -vet -warnings-as-errors -collection:odin-rdf=_deps/odin-rdf
      - run: odin check sparql/internal/lexer -no-entry-point -vet -warnings-as-errors -collection:odin-rdf=_deps/odin-rdf
      - run: odin check sparql/dataset -no-entry-point -vet -warnings-as-errors -collection:odin-rdf=_deps/odin-rdf
      - run: odin check sparql/results -no-entry-point -vet -warnings-as-errors -collection:odin-rdf=_deps/odin-rdf
      - run: odin check benchmarks/bgp -no-entry-point -vet -warnings-as-errors -collection:odin-rdf=_deps/odin-rdf
      - run: odin check examples/minimal -no-entry-point -vet -warnings-as-errors -collection:odin-rdf=_deps/odin-rdf
      - run: odin check examples/custom_view -no-entry-point -vet -warnings-as-errors -collection:odin-rdf=_deps/odin-rdf
      - run: odin check tests/fuzz -vet -warnings-as-errors -collection:odin-rdf=_deps/odin-rdf
      - run: odin test sparql -sanitize:address -collection:odin-rdf=_deps/odin-rdf
      - run: odin test sparql/internal/lexer -sanitize:address -collection:odin-rdf=_deps/odin-rdf
      - run: odin test sparql/results -sanitize:address -collection:odin-rdf=_deps/odin-rdf
      - run: odin test tests/public_parser -sanitize:address -collection:odin-rdf=_deps/odin-rdf
      - run: odin test tests/public_engine -sanitize:address -collection:odin-rdf=_deps/odin-rdf
      - run: odin test tests/dataset -sanitize:address -collection:odin-rdf=_deps/odin-rdf
      - run: odin test tests/property -sanitize:address -collection:odin-rdf=_deps/odin-rdf
      - run: odin run tests/fuzz -sanitize:address -define:FUZZ_CASES=5000 -define:FUZZ_MAX_BYTES=512 -collection:odin-rdf=_deps/odin-rdf
      - run: odin test sparql/algebra -sanitize:address -collection:odin-rdf=_deps/odin-rdf
      - run: odin test sparql/eval -sanitize:address -collection:odin-rdf=_deps/odin-rdf
      - run: odin test sparql/engine -sanitize:address -collection:odin-rdf=_deps/odin-rdf
      - run: odin test sparql/engine -o:speed -collection:odin-rdf=_deps/odin-rdf
